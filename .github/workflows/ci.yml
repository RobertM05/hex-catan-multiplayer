name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# One CI run per ref; superseded PR runs are cancelled, main runs are not.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  syntax:
    name: Syntax & Code Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run check

  import-check:
    name: ESM Module Imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Validate server imports
        run: |
          for f in server/game/*.js; do
            echo "Importing $f"
            node --input-type=module -e "import('./$f').catch(err => { console.error('Import error in $f:', err); process.exit(1); })" || exit 1
          done
          echo "All backend game modules imported successfully"

  test:
    name: Test Suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm test

  qa:
    name: QA Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Code hygiene gate
        run: |
          if grep -rnE "TODO|FIXME|HACK|debugger" server/ public/js/ tests/ --include='*.js'; then
            echo "QA violation: TODO/FIXME/HACK comments or debugger statements found."
            exit 1
          fi
          echo "Code hygiene gate passed."
      - run: npm ci
      - name: QA rules and game engine tests
        run: node --test tests/qaAuditAndRules.test.js tests/gameEngine.test.js

  security-audit:
    name: Security & Dependencies Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm audit --audit-level=high

  asset-check:
    name: Client Assets & HTML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static asset integrity
        run: |
          test -f public/index.html
          test -f public/css/main.css
          test -f public/css/board.css
          test -f public/css/ui.css
          test -f public/js/app.js
          test -f public/js/renderer.js
          test -f public/js/network.js
          test -f public/js/audio.js
          test -f public/js/i18n.js
          echo "All client assets verified successfully."
