name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deployments so two CD runs can never overlap. A newer commit on
# main cancels the in-flight deploy in favor of the latest one.
concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Pre-deployment Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  deploy:
    name: Deploy Application
    needs: validate
    runs-on: ubuntu-latest
    # Cap the job so a hung webhook or health probe cannot occupy a runner.
    # Health gate: 12 attempts × ~10s plus curl timeouts stays well under this.
    timeout-minutes: 10
    # Hoisted to job level on purpose: a step's `if` is evaluated BEFORE that
    # step's own `env` is applied, so a step-scoped DEPLOY_HOOK_URL would always
    # evaluate as empty and the deploy step would be silently skipped.
    env:
      DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK || secrets.DEPLOY_HOOK_URL }}
      HEALTH_CHECK_URL: ${{ secrets.HEALTH_CHECK_URL }}
      ROLLBACK_HOOK_URL: ${{ secrets.ROLLBACK_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Webhook (Render / Railway / Custom PaaS)
        if: env.DEPLOY_HOOK_URL != ''
        timeout-minutes: 2
        run: |
          echo "Triggering deployment webhook..."
          curl -f --connect-timeout 10 --max-time 30 -X POST "$DEPLOY_HOOK_URL"
          echo "Deployment trigger sent successfully."

      - name: Verify Health Check
        if: env.DEPLOY_HOOK_URL != '' && env.HEALTH_CHECK_URL != ''
        timeout-minutes: 5
        run: |
          echo "Verifying deployment at $HEALTH_CHECK_URL..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 "$HEALTH_CHECK_URL" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Health check succeeded with status 200!"
              exit 0
            fi
            echo "Attempt $i failed (status $STATUS), retrying in 10s..."
            sleep 10
          done
          echo "Health check timed out!"
          if [ -n "$ROLLBACK_HOOK_URL" ]; then
            echo "Triggering automated rollback webhook..."
            curl -f --connect-timeout 10 --max-time 30 -X POST "$ROLLBACK_HOOK_URL" || true
          fi
          exit 1

      - name: Health Check Skipped
        if: env.DEPLOY_HOOK_URL != '' && env.HEALTH_CHECK_URL == ''
        run: |
          echo "::warning::HEALTH_CHECK_URL secret is not set; skipping post-deploy verification."

      - name: Deployment Fallback / Self-check
        if: env.DEPLOY_HOOK_URL == ''
        run: |
          echo "No external deployment hook secret detected (RENDER_DEPLOY_HOOK / DEPLOY_HOOK_URL)."
          echo "Package is production-ready for deployment to Render, Railway, Fly.io, or VPS."
          echo "Server entrypoint: server/server.js"
          echo "Port: \${PORT:-3000}"
